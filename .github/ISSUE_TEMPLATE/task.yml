name: 🛠️ Work package
description: A planned piece of Platform 3.0 work with an outcome and an exit condition
title: "WP: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        A work package is one slice of work with an outcome. State the outcome and how to tell that it is done.
  - type: textarea
    id: outcome
    attributes:
      label: 🎯 Outcome
      description: What is true when this package is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 🧩 Scope
      description: A checklist of what is included. Use `- [ ]` items.
      placeholder: "- [ ] First deliverable\n- [ ] Second deliverable"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: ✅ Done when
      description: The checks or exit criteria that prove it.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: 🚫 Not in this package
      description: What this package deliberately leaves out.
  - type: dropdown
    id: epic
    attributes:
      label: 🏗️ Epic
      options:
        - Direction
        - Pipeline
        - Platform
        - Operations
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 📐 Size
      description: A relative size, not a date.
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true
