name: ✨ Feature
description: A new capability or an improvement
title: "Feature: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change for a running server, and how to tell that it is done.
    validations:
      required: true
