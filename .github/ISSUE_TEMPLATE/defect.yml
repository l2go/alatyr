name: 🐛 Defect
description: A confirmed server defect with a broken invariant
title: "[Defect] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        File a defect only when an invariant is broken and the impact on a running server is clear.
  - type: textarea
    id: invariant
    attributes:
      label: ⚖️ Broken invariant
      description: The rule this path violates.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 💥 Impact
      description: What a running server does wrong. Item create or loss, session desync, crash, or login failure.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 🚦 Severity
      options:
        - blocker
        - major
        - minor
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 🧭 Area
      options:
        - economy
        - session
        - packets
        - persistence
        - concurrency
        - commons
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 🔎 Evidence
      description: Symbol, path, and why that path breaks the invariant.
    validations:
      required: true
  - type: textarea
    id: confirmation
    attributes:
      label: 🧪 Confirmation
      description: A deterministic check, or the thread interleaving when a live server is required.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: ✅ Acceptance
      description: The single condition that is true after the fix. Do not expand this into a subsystem rewrite.
    validations:
      required: true
