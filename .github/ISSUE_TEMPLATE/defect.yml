name: 🐛 Defect
description: The server does something wrong
title: "Defect: "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: What the server does, and what it costs a running server, for example lost items or a failed login.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Steps from a fresh start, or the code path and why it breaks.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the image tag or commit.
      placeholder: "v3.2.1"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The lines around the failure. Leave out passwords and session keys.
      render: text
