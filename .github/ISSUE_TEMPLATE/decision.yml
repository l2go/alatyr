name: 🧭 Decision proposal
description: Propose or record a decision
title: "Decision: "
labels: ["type:decision", "needs-decision"]
body:
  - type: markdown
    attributes:
      value: |
        State the problem, the options, and what the change costs.
  - type: textarea
    id: context
    attributes:
      label: 📌 Context
      description: The problem, the constraints, and what is already decided.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: ⚖️ Options
      description: Each option with its cost and its risk.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: 👍 Recommendation
      description: The option you suggest and why.
  - type: textarea
    id: revisit
    attributes:
      label: 🔁 Revisit when
      description: The condition that would reopen the decision.
