version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/deploy/image"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker-compose
    directory: "/deploy"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
