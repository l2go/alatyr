name: build

# Pull requests check the changed Go modules, deployment scripts, and authored
# world. Main builds and verifies both native image platforms, then signs and
# publishes their index. Release promotes that verified digest without rebuilding.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Runs of main are never cancelled, so the published
# `edge` image always belongs to a finished pipeline.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # Decides which parts a pull request changes. Main and manual runs check every part. A required check whose job is
  # skipped counts as passed, so the jobs below run whenever this job did not succeed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.paths.outputs.go }}
      world: ${{ steps.paths.outputs.world }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The merge commit of a pull request and its first parent, the head of the base branch. Without rename
          # detection a moved file names both its old and its new path.
          fetch-depth: 2
          persist-credentials: false

      - name: Name the changed parts
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' go=true world=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames HEAD^1 HEAD
          tools/ci/changed-parts.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"

  # Guards of the whole tree run for every change: a pull request that touches none of the parts below must still not
  # bring back the inherited world, or break the layout, licenses, and public content of the Go components.
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test how the changed parts are named
        run: bash tools/ci/test-changed-parts.sh

      - name: Test disposable PostgreSQL startup
        run: bash tools/ci/test-go-postgres.sh

      - name: Check the tree has no inherited world
        run: |
          set -euo pipefail
          if [ -e l2jfree-datapack ]; then
            echo "::error::l2jfree-datapack is still in the tree"
            exit 1
          fi
          cfg="$(find . -path './.git' -prune -o -name 'scripts.cfg' -print)"
          if [ -n "$cfg" ]; then
            echo "::error::scripts.cfg is in the tree"
            printf '%s\n' "$cfg"
            exit 1
          fi
          outside="$(find . \( -path './.git' -o -path './world' \) -prune -o -type d \( -path '*/data/scripts' -o -path '*/data/html' -o -path '*/data/stats' \) -print)"
          if [ -n "$outside" ]; then
            echo "::error::data/scripts, data/html, or data/stats exists outside world/"
            printf '%s\n' "$outside"
            exit 1
          fi
          echo "tree check passed: no l2jfree-datapack, no scripts.cfg, no data/scripts, data/html, or data/stats outside world/"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Check module boundaries and public content
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go run ./tools/ci/check-engine-go.go

  # Checks the Go modules, the boundary checker, and the workflows.
  go:
    name: go
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # With GOTOOLCHAIN=local, setup-go reads the go directive, not toolchain.
          go-version: "1.27.3"
          cache: false

      - name: Check Go version and formatting
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test -z "$(gofmt -l engine/go tools/ci/check-engine-go.go tools/ci/check-engine-go_test.go)"

      - name: Check workspace synchronization
        run: |
          set -euo pipefail
          go work sync
          git diff --exit-code -- go.work go.work.sum tools/world/go.mod tools/world/go.sum engine/go
          test ! -e go.work.sum
          test "$(find engine/go -name go.mod -type f | sort)" = "$(printf '%s\n' engine/go/go.mod engine/go/protocol/go.mod engine/go/server/go.mod)"
          for module in tools/world engine/go/protocol; do
            test ! -e "$module/go.sum"
          done
          (cd engine/go/server && GOWORK=off go mod tidy -diff)
          (cd engine/go && GOWORK=off go mod tidy -diff)
          printf '%s\n' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0 h1:rMwRQ7Ky/sqoadBzm0G8x1JznT9qSwVIoEIzajZFh/A=' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0/go.mod h1:KxH0itUWLh+hHZM1yKrUsgtiLQnkhEe5BSL+CdrYic0=' | cmp - engine/go/go.sum

      - name: Vet and test the boundary checker
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go vet ./tools/ci/check-engine-go.go ./tools/ci/check-engine-go_test.go
          go test -race -count=1 -timeout=2m ./tools/ci/check-engine-go.go ./tools/ci/check-engine-go_test.go

      - name: Vet and check each module outside the workspace
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in engine/go engine/go/protocol engine/go/server; do
            (
              cd "$module"
              go vet ./...
              # Keep fixed scenarios, generated programs and the complete native
              # sequence corpus in separate invocations of the same package.
              # All invocations retain -race, all inputs and both workspace modes.
              if [ "$module" = engine/go ]; then
                go test -race -parallel=2 -count=1 -timeout=3m -skip='^(FuzzGatewaySequence|TestGeneratedGatewaySequences)$' ./...
                go test -race -parallel=2 -count=1 -timeout=3m -run='^TestGeneratedGatewaySequences$' ./worldtest
                go test -race -parallel=2 -count=1 -timeout=3m -run='^FuzzGatewaySequence$' ./worldtest
              else
                go test -race -parallel=2 -count=1 -timeout=3m ./...
              fi
            )
          done

      - name: Check each module in the workspace
        run: |
          set -euo pipefail
          for module in engine/go engine/go/protocol engine/go/server; do
            (
              cd "$module"
              go vet ./...
              # Keep fixed scenarios, generated programs and the complete native
              # sequence corpus in separate invocations of the same package.
              # All invocations retain -race, all inputs and both workspace modes.
              if [ "$module" = engine/go ]; then
                go test -race -parallel=2 -count=1 -timeout=3m -skip='^(FuzzGatewaySequence|TestGeneratedGatewaySequences)$' ./...
                go test -race -parallel=2 -count=1 -timeout=3m -run='^TestGeneratedGatewaySequences$' ./worldtest
                go test -race -parallel=2 -count=1 -timeout=3m -run='^FuzzGatewaySequence$' ./worldtest
              else
                go test -race -parallel=2 -count=1 -timeout=3m ./...
              fi
            )
          done

      - name: Install pinned CI tools
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/go-component-tools"
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Check Go code with Staticcheck
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in engine/go engine/go/protocol engine/go/server; do
            (cd "$module" && staticcheck ./...)
          done
          staticcheck ./tools/ci/*.go

      - name: Lint the workflows
        run: |
          set -euo pipefail
          actionlint .github/workflows/*.yml

      - name: Check deployment and release scripts
        run: |
          set -euo pipefail
          bash deploy/image/test-init-secrets.sh
          bash deploy/release/test-bundle.sh
          bash deploy/test-checks.sh
          bash -n deploy/*.sh deploy/image/bin/* deploy/postgres/init/*.sh

      - name: Check module vulnerabilities
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in engine/go engine/go/protocol engine/go/server; do
            (cd "$module" && govulncheck -test ./...)
          done

      - name: Check codec fuzzing readiness
        # The seed corpus runs with the tests of every pull request; the search for new inputs runs on main.
        if: github.event_name != 'pull_request'
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go run ./tools/ci/check-engine-go.go -fuzz

      - name: Check bridge profile fuzzing readiness
        # The seed corpus runs with the tests of every pull request; the search for new inputs runs on main.
        if: github.event_name != 'pull_request'
        working-directory: engine/go/bridge
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          targets="$(go test -list '^FuzzDecodeProfile$' ./profile)"
          printf '%s\n' "$targets" | grep -Fxq FuzzDecodeProfile
          go test -run='^$' -fuzz='^FuzzDecodeProfile$' -fuzztime=10s -parallel=1 -timeout=2m ./profile

      - name: Check participant dictionary fuzzing readiness
        # The seed corpus runs with the tests of every pull request; the search for new inputs runs on main.
        if: github.event_name != 'pull_request'
        working-directory: engine/go/gateway
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          targets="$(go test -list '^FuzzDecodeMeaning$' ./meaning)"
          printf '%s\n' "$targets" | grep -Fxq FuzzDecodeMeaning
          go test -run='^$' -fuzz='^FuzzDecodeMeaning$' -fuzztime=10s -parallel=1 -timeout=2m ./meaning

      - name: Check gateway transport fuzzing readiness
        # The seed corpus runs with the tests of every pull request; the search for new inputs runs on main.
        if: github.event_name != 'pull_request'
        working-directory: engine/go/gateway
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for target in FuzzStreamRead FuzzWebSocketRead; do
            targets="$(go test -list "^$target$" .)"
            printf '%s\n' "$targets" | grep -Fxq "$target"
            go test -run='^$' -fuzz="^$target$" -fuzztime=5s -parallel=1 -timeout=2m .
          done

      - name: Check raw adapter fuzzing readiness
        # The seed corpus runs with the tests of every pull request; the search for new inputs runs on main.
        if: github.event_name != 'pull_request'
        working-directory: engine/go/gateway
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          targets="$(go test -list '^FuzzRawEvent$' ./backend)"
          printf '%s\n' "$targets" | grep -Fxq FuzzRawEvent
          go test -run='^$' -fuzz='^FuzzRawEvent$' -fuzztime=5s -parallel=1 -timeout=2m ./backend

      - name: Check world translation fuzzing readiness
        # The seed corpus runs with the tests of every pull request; the search for new inputs runs on main.
        if: github.event_name != 'pull_request'
        working-directory: engine/go/worldbridge
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for target in FuzzNormalizeCommand FuzzParseHTML; do
            targets="$(go test -list "^$target$" .)"
            printf '%s\n' "$targets" | grep -Fxq "$target"
            go test -run='^$' -fuzz="^$target$" -fuzztime=5s -parallel=1 -timeout=2m .
          done

      - name: Check gateway sequence fuzzing readiness
        # Pull requests run the deterministic corpus; main also searches for new command sequences.
        if: github.event_name != 'pull_request'
        working-directory: engine/go
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          targets="$(go test -list '^FuzzGatewaySequence$' ./worldtest)"
          printf '%s\n' "$targets" | grep -Fxq FuzzGatewaySequence
          go test -run='^$' -fuzz='^FuzzGatewaySequence$' -fuzztime=20s -parallel=1 -timeout=2m ./worldtest

      - name: Check that validation left the source unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test ! -e go.work.sum
          test "$(find engine/go -name go.mod -type f | sort)" = "$(printf '%s\n' engine/go/go.mod engine/go/protocol/go.mod engine/go/server/go.mod)"
          for module in tools/world engine/go/protocol; do
            test ! -e "$module/go.sum"
          done
          printf '%s\n' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0 h1:rMwRQ7Ky/sqoadBzm0G8x1JznT9qSwVIoEIzajZFh/A=' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0/go.mod h1:KxH0itUWLh+hHZM1yKrUsgtiLQnkhEe5BSL+CdrYic0=' | cmp - engine/go/go.sum

  # Formats, vets, and tests the world tool, then checks that the authored world matches a fresh render.
  # It runs independently of the application image.
  world:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.world == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Check formatting, vet, and test
        working-directory: tools/world
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v ./...

      - name: Check the authored world
        run: go run ./tools/world check --world world

      # A failed check still renders, so the built tree can be committed without editing it by hand.
      - name: Render the authored world
        if: failure()
        run: |
          set -euo pipefail
          copy="${RUNNER_TEMP}/world-render"
          rm -rf "$copy"
          mkdir -p "$copy"
          cp -a world "$copy/world"
          go run ./tools/world render --world "$copy/world"

      - name: Upload the rendered world
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-render
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/world-render/world/catalog
            ${{ runner.temp }}/world-render/world/data

  go-postgres:
    name: go-postgres
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Verify fresh-schema persistence and participant process restart
        run: bash tools/ci/go-postgres.sh

  # Build and exercise both architectures natively. No deployment is published
  # until its participant restart/restore checks and content checks pass.
  image-platform:
    name: image (${{ matrix.arch }}, ${{ matrix.runner }})
    needs: [go, go-postgres, world, guards]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/l2go/alatyr
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: alatyr:ci
          cache-from: type=gha,scope=go-image-${{ matrix.arch }}
          cache-to: type=gha,scope=go-image-${{ matrix.arch }},mode=max

      - name: Verify image content, user and authored world
        run: |
          deploy/verify-image.sh alatyr:ci linux/${{ matrix.arch }}
          deploy/check-image-world.sh alatyr:ci
          docker image inspect alatyr:ci --format '{{.Size}} bytes' > image-size.txt

      - name: Exercise readiness, live shutdown, restart and backup restore
        env:
          GOTOOLCHAIN: local
          GOMAXPROCS: "2"
        run: bash deploy/check-server.sh alatyr:ci

      - name: Keep image verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            image-size.txt
            image-file-list.txt
            image-world-manifest.txt
            image-server.log
            image-postgres.log
            image-participant-tests.jsonl

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          cache-from: type=gha,scope=go-image-${{ matrix.arch }}

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${REGISTRY_IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Attest the build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Resolve the platform manifest
        id: manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          digest="$(docker buildx imagetools inspect "$REGISTRY_IMAGE@${{ steps.push.outputs.digest }}" --raw | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "${{ matrix.arch }}") | .digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$REGISTRY_IMAGE@$digest"

      - name: Attest the platform manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Save the verified platform digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p digests
          digest="${{ steps.push.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Upload the platform digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # The rules of main require one check named image, and it is also the gate for the checks the rules do not name.
  # It always runs, because a skipped required check would count as passed. For a pull request, which builds no image,
  # it requires the guards and the Go checks (passed, or skipped because Go did not change). After a merge it also
  # requires the image of every platform, and Go must have run.
  image:
    needs: [guards, go, go-postgres, image-platform]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the guards, Go, and the image of every platform
        env:
          EVENT: ${{ github.event_name }}
          GUARDS: ${{ needs.guards.result }}
          GO_RESULT: ${{ needs.go.result }}
          GO_POSTGRES_RESULT: ${{ needs.go-postgres.result }}
          IMAGE: ${{ needs.image-platform.result }}
        run: |
          set -euo pipefail
          test "$GUARDS" = success || { echo "::error::the guards did not pass: $GUARDS"; exit 1; }
          if [ "$EVENT" = pull_request ]; then
            test "$GO_POSTGRES_RESULT" = success -o "$GO_POSTGRES_RESULT" = skipped || { echo "::error::the PostgreSQL Go checks did not pass: $GO_POSTGRES_RESULT"; exit 1; }
            test "$GO_RESULT" = success -o "$GO_RESULT" = skipped || { echo "::error::the Go checks did not pass: $GO_RESULT"; exit 1; }
            exit 0
          fi
          test "$GO_POSTGRES_RESULT" = success || { echo "::error::the PostgreSQL Go checks did not pass: $GO_POSTGRES_RESULT"; exit 1; }
          test "$GO_RESULT" = success || { echo "::error::the Go checks did not pass: $GO_RESULT"; exit 1; }
          test "$IMAGE" = success || { echo "::error::the image of a platform did not pass: $IMAGE"; exit 1; }

  # Names the verified digests edge and sha-* only when every check of the commit passed.
  image-index:
    needs: [image, guards, go, go-postgres, world]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/l2go/alatyr
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - name: Merge the verified platform images
        id: merge
        run: |
          set -euo pipefail
          sources=()
          for file in digests/*; do sources+=("$REGISTRY_IMAGE@sha256:${file##*/}"); done
          test "${#sources[@]}" = 2
          docker buildx imagetools create -t "$REGISTRY_IMAGE:edge" -t "$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the index
        run: cosign sign --yes "$REGISTRY_IMAGE@${{ steps.merge.outputs.digest }}"
      - name: Attest the index
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      - name: Verify the index and both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/verify-published-image.sh "$REGISTRY_IMAGE@${{ steps.merge.outputs.digest }}"
