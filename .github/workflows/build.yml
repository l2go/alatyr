name: build

# The pipeline. Microsoft OpenJDK 25 builds and tests the code. The image job
# builds the Linux image from the verified platform distribution, starts it with
# Docker Compose, probes the login and world ports, and publishes the image from
# main. The release workflow promotes a published image to a version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Runs of main are never cancelled, so the published
# `edge` image always belongs to a finished pipeline.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # Checks the Go module scaffolds independently of the Java server.
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # With GOTOOLCHAIN=local, setup-go reads the go directive, not toolchain.
          go-version: "1.27.3"
          cache: false

      - name: Check Go version and formatting
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test -z "$(gofmt -l engine/go tools/ci/check-engine-go.go tools/ci/check-engine-go_test.go)"

      - name: Check workspace synchronization
        run: |
          set -euo pipefail
          go work sync
          git diff --exit-code -- go.work go.work.sum tools/world/go.mod tools/world/go.sum engine/go
          test ! -e go.work.sum
          for module in tools/world engine/go/protocol engine/go/world; do
            test ! -e "$module/go.sum"
          done
          printf '%s\n' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0 h1:rMwRQ7Ky/sqoadBzm0G8x1JznT9qSwVIoEIzajZFh/A=' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0/go.mod h1:KxH0itUWLh+hHZM1yKrUsgtiLQnkhEe5BSL+CdrYic0=' | cmp - engine/go/bridge/go.sum
          cmp engine/go/bridge/go.sum engine/go/gateway/go.sum

      - name: Vet and test the boundary checker
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go vet ./tools/ci/check-engine-go.go ./tools/ci/check-engine-go_test.go
          go test -race -count=1 -timeout=2m ./tools/ci/check-engine-go.go ./tools/ci/check-engine-go_test.go

      - name: Check module boundaries and public content
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go run ./tools/ci/check-engine-go.go

      - name: Vet and check each module outside the workspace
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in protocol gateway bridge world; do
            (cd "engine/go/$module" && go vet ./... && go test -race -count=1 -timeout=2m ./...)
          done

      - name: Check each module in the workspace
        run: |
          set -euo pipefail
          for module in protocol gateway bridge world; do
            (cd "engine/go/$module" && go test -count=1 -timeout=2m ./...)
          done

      - name: Install pinned CI tools
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/go-component-tools"
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Check Go code with Staticcheck
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in engine/go/*/go.mod; do
            (cd "${module%/go.mod}" && staticcheck ./...)
          done
          staticcheck ./tools/ci/*.go

      - name: Lint the changed workflows
        run: |
          set -euo pipefail
          actionlint .github/workflows/build.yml .github/workflows/docs-links.yml .github/workflows/public-text.yml

      - name: Check module vulnerabilities
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in protocol gateway bridge world; do
            (cd "engine/go/$module" && govulncheck -test ./...)
          done

      - name: Check codec fuzzing readiness
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go run ./tools/ci/check-engine-go.go -fuzz

      - name: Check bridge profile fuzzing readiness
        working-directory: engine/go/bridge
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          targets="$(go test -list '^FuzzDecodeProfile$' ./profile)"
          printf '%s\n' "$targets" | grep -Fxq FuzzDecodeProfile
          go test -run='^$' -fuzz='^FuzzDecodeProfile$' -fuzztime=10s -parallel=1 -timeout=2m ./profile

      - name: Check participant dictionary fuzzing readiness
        working-directory: engine/go/gateway
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          targets="$(go test -list '^FuzzDecodeMeaning$' ./meaning)"
          printf '%s\n' "$targets" | grep -Fxq FuzzDecodeMeaning
          go test -run='^$' -fuzz='^FuzzDecodeMeaning$' -fuzztime=10s -parallel=1 -timeout=2m ./meaning

      - name: Check gateway transport fuzzing readiness
        working-directory: engine/go/gateway
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for target in FuzzStreamRead FuzzWebSocketRead; do
            targets="$(go test -list "^$target$" .)"
            printf '%s\n' "$targets" | grep -Fxq "$target"
            go test -run='^$' -fuzz="^$target$" -fuzztime=5s -parallel=1 -timeout=2m .
          done

      - name: Check that validation left the source unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test ! -e go.work.sum
          for module in tools/world engine/go/protocol engine/go/world; do
            test ! -e "$module/go.sum"
          done
          printf '%s\n' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0 h1:rMwRQ7Ky/sqoadBzm0G8x1JznT9qSwVIoEIzajZFh/A=' \
            'github.com/l2go/alatyr/engine/go/protocol v0.0.0-20261023084050-3b52c8d267a0/go.mod h1:KxH0itUWLh+hHZM1yKrUsgtiLQnkhEe5BSL+CdrYic0=' | cmp - engine/go/bridge/go.sum
          cmp engine/go/bridge/go.sum engine/go/gateway/go.sum

  # Formats, vets, and tests the world tool, then checks that the authored world matches a fresh render.
  # It does not build the server and runs beside the Java build.
  world:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Check the tree has no inherited world
        run: |
          set -euo pipefail
          if [ -e l2jfree-datapack ]; then
            echo "::error::l2jfree-datapack is still in the tree"
            exit 1
          fi
          cfg="$(find . -path './.git' -prune -o -name 'scripts.cfg' -print)"
          if [ -n "$cfg" ]; then
            echo "::error::scripts.cfg is in the tree"
            printf '%s\n' "$cfg"
            exit 1
          fi
          outside="$(find . \( -path './.git' -o -path './world' \) -prune -o -type d \( -path '*/data/scripts' -o -path '*/data/html' -o -path '*/data/stats' \) -print)"
          if [ -n "$outside" ]; then
            echo "::error::data/scripts, data/html, or data/stats exists outside world/"
            printf '%s\n' "$outside"
            exit 1
          fi
          echo "tree check passed: no l2jfree-datapack, no scripts.cfg, no data/scripts, data/html, or data/stats outside world/"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Check formatting, vet, and test
        working-directory: tools/world
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v ./...

      - name: Check the authored world
        run: go run ./tools/world check --world world

      # A failed check still renders, so the built tree can be committed without editing it by hand.
      - name: Render the authored world
        if: failure()
        run: |
          set -euo pipefail
          copy="${RUNNER_TEMP}/world-render"
          rm -rf "$copy"
          mkdir -p "$copy"
          cp -a world "$copy/world"
          go run ./tools/world render --world "$copy/world"

      - name: Upload the rendered world
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-render
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/world-render/world/catalog
            ${{ runner.temp }}/world-render/world/data

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Build metadata and version info need only the checked out commit.
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      # The release bundle script is tested here, before it is ever used for a release.
      - name: Test the release bundle script
        run: bash deploy/release/test-bundle.sh

      # Unit tests run in this job. Tests tagged integration need PostgreSQL and run
      # in the integration job. Surefire excludes that tag unless -Dgroups is set.
      # Record the Maven build JVM so the baseline does not depend on Surefire.
      - name: Build, test, and package with Java 25 while recording JFR
        env:
          MAVEN_OPTS: -XX:StartFlightRecording=filename=${{ github.workspace }}/jfr/maven-build.jfr,settings=profile,dumponexit=true
        run: >-
          mkdir -p jfr &&
          ./mvnw -B -ntp
          -Dl2jfree.build.revision=${{ github.sha }}
          install

      - name: Report JFR baseline size and checksum
        run: |
          recording="jfr/maven-build.jfr"
          test -s "$recording"
          stat -c '%s bytes %n' "$recording"
          sha256sum "$recording"

      - name: Upload baseline JFR recordings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l2jfree-jfr-baseline
          if-no-files-found: error
          path: jfr/*.jfr

      - name: Generate aggregate CycloneDX SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom

      - name: Verify the platform distribution
        shell: bash
        run: |
          mapfile -t archives < <(find engine/java/platform/target -maxdepth 1 -name 'l2jfree-platform-*-dist.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one platform distribution, found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          entries="$(unzip -Z1 "$archive" | tee dist-entries.txt)"
          sha256sum "$archive" > dist-sha256.txt
          if grep -Eiq '(^|/)libs/[^/]*(spring|hibernate|cglib|ehcache|c3p0|mchange-commons|ecj|irclib)[^/]*\.jar$' <<< "$entries"; then
            echo "The platform distribution contains a removed persistence, compiler, or IRC library: $archive"
            exit 1
          fi
          if grep -Evq '^l2jfree/' <<< "$entries"; then
            echo "Every entry of the platform distribution must be under l2jfree/: $archive"
            exit 1
          fi
          require_entry() {
            if ! grep -Eq "$1" <<< "$entries"; then
              echo "The platform distribution is missing an entry that matches $1: $archive"
              exit 1
            fi
          }
          require_entry '^l2jfree/l2jfree-platform(-[^/]+)?\.jar$'
          require_entry '^l2jfree/config/server\.properties$'
          require_entry '^l2jfree/config/loginserver\.properties$'
          require_entry '^l2jfree/config/telnet\.properties$'
          require_entry '^l2jfree/config/logback\.xml$'
          require_entry '^l2jfree/agents/opentelemetry-javaagent\.jar$'
          require_entry '^l2jfree/world/world\.properties$'
          require_entry '^l2jfree/world/LICENSE$'
          require_entry '^l2jfree/world/catalog/npc_template\.csv$'
          world_top="$(grep -E '^l2jfree/world/[^/]' <<< "$entries" | sed -E 's|^l2jfree/world/([^/]+).*|\1|' | sort -u)"
          expected_top="$(printf '%s\n' LICENSE catalog data world.properties)"
          if [[ "$world_top" != "$expected_top" ]]; then
            echo "The world in the archive is not only world.properties, LICENSE, catalog, and data:"
            printf '%s\n' "$world_top"
            exit 1
          fi
          if grep -Eq '(^|/)scripts\.cfg$|\.class$|\.py$' <<< "$entries"; then
            echo "The platform distribution contains a script list, bytecode, or Python: $archive"
            exit 1
          fi
          if grep -Eq '^l2jfree/(data|catalog)/' <<< "$entries"; then
            echo "The platform distribution still has l2jfree/data or l2jfree/catalog: $archive"
            exit 1
          fi
          if ! unzip -p "$archive" l2jfree/world/world.properties | grep -qx 'world.id=buyan-okolitsa'; then
            echo "The archive passport is not world.id=buyan-okolitsa: $archive"
            exit 1
          fi
          for artifact in slf4j-api jul-to-slf4j logback-classic logback-core; do
            count="$(grep -Ec "^l2jfree/libs/${artifact}-[^/]+\.jar$" <<< "$entries" || true)"
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one ${artifact} runtime jar in $archive, found $count"
              exit 1
            fi
          done
          if grep -Eiq '^l2jfree/libs/(slf4j-jdk14|commons-logging|jcl-over-slf4j)-[^/]+\.jar$' <<< "$entries"; then
            echo "The platform distribution contains a conflicting logging runtime jar: $archive"
            exit 1
          fi
          test -s target/bom.json

      - name: Upload the distribution file list
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-file-list
          if-no-files-found: warn
          path: |
            dist-entries.txt
            dist-sha256.txt

      - name: Scan dependency SBOM for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: target/bom.json
          fail-build: false
          output-format: json
          output-file: target/vulnerability-report.json

      - name: Verify vulnerability report
        run: test -s target/vulnerability-report.json

      - name: Collect the verified distributions
        shell: bash
        run: |
          version="$(./mvnw -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p dist
          cp "engine/java/platform/target/l2jfree-platform-${version}-dist.zip" dist/
          cp "engine/java/smoke/target/l2jfree-smoke-${version}.jar" dist/l2jfree-smoke.jar
          cp target/bom.json "dist/l2jfree-${version}-sbom.json"
          cp target/vulnerability-report.json "dist/l2jfree-${version}-vulnerability-report.json"

      - name: Upload the verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l2jfree-dist
          if-no-files-found: error
          path: dist/*

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      - name: Run the PostgreSQL integration tests
        run: |
          ./mvnw -B -ntp \
            -Dgroups=integration \
            -Dsurefire.excludedGroups= \
            -Dl2jfree.build.revision=${{ github.sha }} \
            verify
          reports="$(find engine/java/game/target/surefire-reports engine/java/login/target/surefire-reports -name 'TEST-*.xml' | wc -l | tr -d '[:space:]')"
          expected="$(grep -rl '@Tag("integration")' --include='*.java' engine/java/game/src/test engine/java/login/src/test | wc -l | tr -d '[:space:]')"
          echo "integration reports: ${reports} of ${expected} tagged classes"
          test "${expected}" -gt 0
          test "${reports}" -ge "${expected}"

      - name: Upload what the database checks wrote
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l2jfree-database-checks
          if-no-files-found: ignore
          path: |
            engine/java/game/target/statement-check.txt
            engine/java/game/target/database-docs/*

  # Builds the Platform 3.0 image from the verified platform distribution,
  # starts the stack with Docker Compose, and probes the login and world ports.
  # The world loads for minutes, so the waits are long. A push to
  # main also publishes the image, signed and attested. The package is public,
  # and sha-* tags are kept for 30 days.
  image-platform:
    # The image is published from main, so it waits for every check of the code, not for the build alone.
    name: image (${{ matrix.arch }}, ${{ matrix.runner }})
    needs: [build, integration, go]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/l2go/l2jfree
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: l2jfree-dist
          path: dist

      # The smoke client is a Java program: it logs in, enters the world, and leaves.
      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Stage the image context
        run: |
          unzip -q dist/l2jfree-platform-*-dist.zip -d deploy/image
          test -f deploy/image/l2jfree/config/server.properties
          test -d deploy/image/l2jfree/libs

      - name: Check the script that creates the passwords
        run: deploy/image/test-init-secrets.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: l2jfree:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Verify the image content
        run: |
          deploy/verify-image.sh l2jfree:ci linux/${{ matrix.arch }}
          docker image inspect l2jfree:ci --format '{{.Size}} bytes' | tee image-size.txt

      - name: Record the previous release size
        if: matrix.arch == 'amd64'
        run: |
          docker pull ghcr.io/l2go/l2jfree:3.2.0
          docker image inspect ghcr.io/l2go/l2jfree:3.2.0 --format '{{.Size}} bytes' | tee image-size-before.txt

      - name: Check the image world matches the repository
        run: deploy/check-image-world.sh l2jfree:ci

      - name: Upload the image file list
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-file-list-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            image-size-before.txt
            image-size.txt
            image-file-list.txt
            image-world-manifest.txt

      # The policy of SECURITY.md: a fixed critical or high finding blocks the release, not the merge. The table is
      # kept in the summary of the run, and the daily scan of the published image fails on a finding that blocks.
      - name: Scan the image for known vulnerabilities
        # a problem with the scanner or its database must not block a merge
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: l2jfree:ci
          format: table
          output: trivy.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Keep the scan in the summary of the run
        if: always()
        run: |
          {
            echo "### Fixed critical and high vulnerabilities of the image"
            echo
            echo '```'
            cat trivy.txt 2>/dev/null || echo "no scan report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the platform vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-trivy-${{ matrix.arch }}
          path: trivy.txt
          if-no-files-found: warn

      # Every client of the load test comes from the address of the Docker gateway, and one address may open only so many
      # connections in a short time. The operator directory raises the limits, as an operator behind such an address does.
      - name: Raise the accept limits of the stack for the load
        run: |
          docker volume create l2jfree_config
          docker run --rm --entrypoint bash -v l2jfree_config:/var/lib/l2jfree/config l2jfree:ci -c '
            for file in server loginserver; do
              printf "AcceptWarn = 1000\nAcceptReject = 2000\nAcceptWarnLong = 3000\nAcceptRejectLong = 6000\n" \
                > "/var/lib/l2jfree/config/$file.properties"
            done'

      - name: Start the stack with Docker Compose
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 600

      - name: Probe the login and world ports
        run: |
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 7777 --timeout 60 --connect-only

      # The first session uses an account that the second session, after the restart, must find again with its character.
      - name: Take a client through a whole session
        run: |
          password="$(openssl rand -hex 8)"
          echo "::add-mask::$password"
          echo "SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
          java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 --account smokesave --password "$password" --existing-characters 0

      # Many clients at once, each with an account of its own: accounts, characters, and ids are made concurrently.
      - name: Take many clients through a session at once
        run: java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 --sessions 24 --parallel 6

      # Each module reaches the schemas it owns and nothing else.
      - name: Check what each database role may reach
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: deploy/probe/check-roles.sh

      # Each start of this image is checked on its own window: one passport, no scripts, no ERROR.
      # WARN lines stay visible as a group named by the stage. A warning about items without a template
      # is not an error. It is required only when a step passes --expect-unknown-items.
      - name: Check the server log for the world and for errors
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          deploy/probe/check-server-window.sh first-start
          # the transport of both ports: a native transport that cannot be loaded would leave the server on NIO unnoticed
          test "$(grep -c 'Accepting connections on .* (transport epoll' image-server-logs/first-start.log)" -ge 2 \
            || { echo "::error::the ports do not run on the epoll transport"; grep -E 'Transport|Accepting' image-server-logs/first-start.log | head; exit 1; }

      # The deploy guides change a setting with this command. The extra key is in no default file, so the server names
      # it in a warning when it reads the file, which shows after the restart that the command wrote where the server reads.
      - name: Change a setting the way the deploy guides do
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          printf 'MaximumOnlineUsers = 50\nGuideProbe = 1\n' \
            | docker compose -f deploy/compose.yaml exec -T server tee /var/lib/l2jfree/config/server.properties >/dev/null
          docker compose -f deploy/compose.yaml exec -T server stat -c '%U %a %n' /var/lib/l2jfree/config/server.properties

      - name: Restart the server and probe again
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose -f deploy/compose.yaml restart server
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 600
          # the restart read the setting of the step before
          docker compose -f deploy/compose.yaml logs --no-color server | grep -q "operator file 'server.properties' sets 'GuideProbe'" \
            || { echo "::error::the server did not read the file that the command of the deploy guides wrote"; exit 1; }
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 7777 --timeout 60 --connect-only
          # the account and the character of the first session survived the restart
          java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 --account smokesave --password "$SMOKE_PASSWORD" --existing-characters 1
          # and an account that is new after the restart works as well
          java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240
          deploy/probe/check-server-window.sh restart --since "$since"

      # The flight recording runs from the start and keeps its chunks in the log volume.
      - name: Check the flight recording
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          chunks="$(docker compose -f deploy/compose.yaml exec -T server bash -c 'find /var/lib/l2jfree/log/jfr -name "*.jfr" -size +0 | wc -l')"
          echo "$chunks flight recording chunks in the log volume"
          test "$chunks" -ge 1 || { echo "::error::the log volume holds no flight recording"; exit 1; }

      # One command collects what an incident needs, from a server that keeps running.
      - name: Capture the state of the running stack
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          deploy/probe/capture.sh capture
          ls -l capture
          test -s capture/server.log
          grep -q 'Full thread dump' capture/thread-dump.txt || { echo "::error::the capture has no thread dump"; exit 1; }
          test "$(grep -c '| "' capture/thread-dump.txt)" -gt 20 || { echo "::error::the thread dump holds too few threads"; exit 1; }
          grep -q 'rows)' capture/pg_stat_statements.txt || { echo "::error::the capture has no statement statistics"; exit 1; }
          grep -q 'rows)' capture/pg_stat_activity.txt || { echo "::error::the capture has no session list"; exit 1; }
          # the server is still serving
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60

      # The server stops when asked: within the time Docker gives it, without being killed, and after it saved the
      # state of the world. A save that never ends shows as a kill (exit code 137).
      - name: Stop the server and check how it stops
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          begin="$(date +%s)"
          docker compose -f deploy/compose.yaml stop -t 60 server
          seconds="$(( $(date +%s) - begin ))"
          code="$(docker inspect -f '{{.State.ExitCode}}' l2jfree-server-1)"
          echo "stopped in $seconds s with exit code $code"
          docker compose -f deploy/compose.yaml logs --no-color --tail 300 server > stop.log
          test "$seconds" -lt 30 || { echo "::error::the server needed $seconds s to stop"; exit 1; }
          test "$code" = 0 -o "$code" = 143 || { echo "::error::the server did not stop by itself (exit code $code)"; exit 1; }
          for line in 'RaidBossSpawnManager: All raidboss info saved' 'Olympiad System: Data saved' 'Data saved. All players disconnected'; do
            grep -q "$line" stop.log || { echo "::error::the stop did not log: $line"; exit 1; }
          done

      # The backup and the restore of the deployment guide, run as the guide writes them: a dump of the two schemas, a
      # stack destroyed with its volumes, a clean start, the restore, and the account of the first session finds its
      # character again. The server is stopped by the step before, and the database is still running.
      - name: Rehearse the backup and the restore
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/compose.yaml"
          account_count() {
            $compose exec -T db psql -U postgres -d l2jfree -Atc "SELECT count(*) FROM login.account WHERE name = 'smokesave'"
          }
          test "$(account_count)" = 1
          $compose exec -T db pg_dump -U postgres -d l2jfree -n login -n world -Fc > l2jfree-backup.dump
          test -s l2jfree-backup.dump
          $compose exec -T db pg_restore -l < l2jfree-backup.dump > backup.list
          grep -q 'TABLE DATA login account' backup.list || { echo "::error::the dump holds no accounts"; exit 1; }
          grep -q 'TABLE DATA world player' backup.list || { echo "::error::the dump holds no players"; exit 1; }
          if grep -q ' catalog ' backup.list; then echo "::error::the dump holds the catalog, which the image brings"; exit 1; fi

          since_clean="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          $compose down -v
          $compose up -d --wait --wait-timeout 600
          test "$(account_count)" = 0 || { echo "::error::the clean stack already has the account"; exit 1; }
          deploy/probe/check-server-window.sh backup-clean --since "$since_clean"

          $compose stop server
          $compose exec -T db psql -U postgres -d l2jfree \
            -c 'DROP SCHEMA IF EXISTS report, catalog, world, login CASCADE' \
            -c 'CREATE SCHEMA catalog AUTHORIZATION l2jfree_world' \
            -c 'CREATE SCHEMA report AUTHORIZATION l2jfree_world'
          $compose exec -T db pg_restore -U postgres -d l2jfree --exit-on-error < l2jfree-backup.dump
          test "$(account_count)" = 1 || { echo "::error::the restore did not bring the account back"; exit 1; }
          since_restore="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          $compose start server
          $compose up -d --wait --wait-timeout 600

          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60
          # the same account, with the password of the first session, finds its characters: the first session made one
          # and the session after the restart another
          java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 --account smokesave --password "$SMOKE_PASSWORD" --existing-characters 2
          # the roles of the restored database still reach only their own schema
          deploy/probe/check-roles.sh
          deploy/probe/check-server-window.sh backup-restore --since "$since_restore"

      # The update of the image as the runbook writes it: a stack on the image that is published now (edge) is replaced
      # by the image of this commit, on the same volumes. The account and the character of the old image must survive
      # the migrations of the new one.
      - name: Rehearse the update of the image
        env:
          NEW_IMAGE: l2jfree:ci
          OLD_IMAGE: ghcr.io/l2go/l2jfree:edge
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/compose.yaml"
          if ! docker pull "$OLD_IMAGE"; then
            echo "::warning::$OLD_IMAGE cannot be pulled, so the update was not rehearsed"
            exit 0
          fi
          L2JFREE_IMAGE=l2jfree:ci $compose down -v
          L2JFREE_IMAGE="$OLD_IMAGE" $compose up -d --wait --wait-timeout 600
          password="$(openssl rand -hex 8)"
          echo "::add-mask::$password"
          java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 --account smokeupdate --password "$password" --existing-characters 0

          since_new="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          L2JFREE_IMAGE="$NEW_IMAGE" $compose up -d --wait --wait-timeout 600
          test "$(docker inspect -f '{{.Config.Image}}' l2jfree-server-1)" = "$NEW_IMAGE"
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60
          java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 --account smokeupdate --password "$password" --existing-characters 1
          # edge already ships this authored catalog, so the inventory created above still has templates.
          # The unknown-item warning belongs to a catalog cutover, not to this update.
          deploy/probe/check-server-window.sh update --since "$since_new"

      - name: Upload the server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-server-logs-${{ matrix.arch }}
          if-no-files-found: warn
          path: image-server-logs/

      - name: Show the service logs after a failure
        if: failure()
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          echo "::group::server, last 200 lines"
          docker compose -f deploy/compose.yaml logs --no-color --tail 200 server || true
          echo "::endgroup::"
          echo "::group::db and secrets, last 50 lines"
          docker compose -f deploy/compose.yaml logs --no-color --tail 50 db secrets || true
          echo "::endgroup::"

      - name: Stop the stack
        if: always()
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: docker compose -f deploy/compose.yaml down -v || true

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${REGISTRY_IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Attest the build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Resolve the platform manifest
        id: manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          digest="$(docker buildx imagetools inspect "$REGISTRY_IMAGE@${{ steps.push.outputs.digest }}" --raw | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "${{ matrix.arch }}") | .digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$REGISTRY_IMAGE@$digest"

      - name: Attest the platform manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Save the verified platform digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p digests
          digest="${{ steps.push.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Upload the platform digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # The rules of main require one check named image. It passes only when the image of every platform passed, and it
  # runs even when one failed, because a skipped required check would count as passed.
  image:
    needs: [image-platform, go]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the image of every platform
        env:
          GO_RESULT: ${{ needs.go.result }}
          RESULT: ${{ needs.image-platform.result }}
        run: |
          test "$GO_RESULT" = success || { echo "::error::the Go checks did not pass: $GO_RESULT"; exit 1; }
          test "$RESULT" = success || { echo "::error::the image of a platform did not pass: $RESULT"; exit 1; }

  image-index:
    needs: [image, world, go]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/l2go/l2jfree
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - name: Merge the verified platform images
        id: merge
        run: |
          set -euo pipefail
          sources=()
          for file in digests/*; do sources+=("$REGISTRY_IMAGE@sha256:${file##*/}"); done
          test "${#sources[@]}" = 2
          docker buildx imagetools create -t "$REGISTRY_IMAGE:edge" -t "$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the index
        run: cosign sign --yes "$REGISTRY_IMAGE@${{ steps.merge.outputs.digest }}"
      - name: Attest the index
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      - name: Verify the index and both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/verify-published-image.sh "$REGISTRY_IMAGE@${{ steps.merge.outputs.digest }}"

  # Starts the same image on an empty world: the directory exists and holds a passport plus an empty catalog.
  # Readiness must come with no ERROR, no WARN and no uncaught exception. A missing catalog directory must
  # end the process and name the key. This job does not publish the image and does not change the image job.
  empty-world:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      L2JFREE_IMAGE: l2jfree:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: l2jfree-dist
          path: dist

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Stage the image context
        run: |
          unzip -q dist/l2jfree-platform-*-dist.zip -d deploy/image
          test -f deploy/image/l2jfree/config/server.properties
          test -d deploy/image/l2jfree/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          load: true
          tags: l2jfree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image content
        run: deploy/verify-image.sh l2jfree:ci

      - name: Prepare an empty world and the operator paths
        run: |
          set -euo pipefail
          docker volume create l2jfree_empty_world
          docker volume create l2jfree_config
          docker run --rm --user 0 --entrypoint bash -v l2jfree_empty_world:/world l2jfree:ci -c \
            'mkdir -p /world/catalog && printf "%s\n" "world.id=empty" "world.version=0" > /world/world.properties'
          docker run --rm --entrypoint bash -v l2jfree_config:/var/lib/l2jfree/config l2jfree:ci -c \
            'printf "%s\n" "DatapackRoot = /world" "CatalogDirectory = /world/catalog" > /var/lib/l2jfree/config/server.properties'
          cat > deploy/empty-world.compose.yaml <<'EOF'
          services:
            server:
              restart: "no"
              volumes:
                - l2jfree_empty_world:/world
          volumes:
            l2jfree_empty_world:
              external: true
              name: l2jfree_empty_world
          EOF

      - name: Start on the empty world
        run: docker compose -f deploy/compose.yaml -f deploy/empty-world.compose.yaml up -d --wait --wait-timeout 600

      - name: Save the positive server log
        if: always()
        run: |
          docker compose -f deploy/compose.yaml -f deploy/empty-world.compose.yaml logs --no-color server > empty-positive-server.log || true
          echo "::group::empty-positive-server.log"
          cat empty-positive-server.log || true
          echo "::endgroup::"

      - name: Check the empty-world log
        run: |
          set -euo pipefail
          log=empty-positive-server.log
          test -s "$log" || { echo "::error::the positive server log is empty"; exit 1; }
          passport="$(grep -E 'World id=empty version=0 .*catalog revision [0-9a-f]{64}' "$log" || true)"
          test -n "$passport" || { echo "::error::the log has no passport with id=empty, version=0 and a catalog revision"; exit 1; }
          echo "$passport"
          test "$(grep -c 'World id=empty version=0 ' "$log" || true)" = 1 || { echo "::error::the passport line is not unique"; exit 1; }
          grep -q 'Platform ready' "$log" || { echo "::error::the server did not become ready"; exit 1; }
          timeout 5 bash -c 'echo >/dev/tcp/127.0.0.1/2106' && echo "tcp login 127.0.0.1:2106"
          timeout 5 bash -c 'echo >/dev/tcp/127.0.0.1/7777' && echo "tcp world 127.0.0.1:7777"
          if grep -E '(^|\| )ERROR |Exception in thread|Caused by:|[[:space:]]at com\.l2jfree\.' "$log"; then
            echo "::error::the server log has an ERROR line, an uncaught exception, or a stack trace"
            exit 1
          fi
          if grep -E '(^|\| )WARN ' "$log"; then
            echo "::error::the server log has a WARN line"
            exit 1
          fi

      - name: Stop when the catalog directory is missing
        run: |
          set -euo pipefail
          save_missing_log() {
            docker compose -f deploy/compose.yaml -f deploy/empty-world.compose.yaml logs --no-color server > empty-missing-catalog-server.log || true
            echo "::group::empty-missing-catalog-server.log"
            cat empty-missing-catalog-server.log || true
            echo "::endgroup::"
          }
          docker run --rm --entrypoint bash -v l2jfree_config:/var/lib/l2jfree/config l2jfree:ci -c \
            'printf "%s\n" "DatapackRoot = /world" "CatalogDirectory = /world/missing" > /var/lib/l2jfree/config/server.properties'
          docker compose -f deploy/compose.yaml -f deploy/empty-world.compose.yaml up -d --no-deps --force-recreate server
          trap save_missing_log EXIT
          status=""
          for _ in $(seq 1 150); do
            status="$(docker inspect -f '{{.State.Status}}' l2jfree-server-1)"
            if [ "$status" = "exited" ]; then
              break
            fi
            sleep 2
          done
          echo "server status: ${status}"
          save_missing_log
          trap - EXIT
          test "$status" = "exited" || { echo "::error::the server did not exit"; exit 1; }
          code="$(docker inspect -f '{{.State.ExitCode}}' l2jfree-server-1)"
          echo "exit code: ${code}"
          case "$code" in
            0|137|143) echo "::error::exit code ${code} is not a configuration failure"; exit 1 ;;
          esac
          log=empty-missing-catalog-server.log
          grep -q 'CatalogDirectory does not exist: /world/missing' "$log" || { echo "::error::the log does not name CatalogDirectory and the path"; exit 1; }
          test "$(grep -c 'CatalogDirectory does not exist:' "$log" || true)" = 1 || { echo "::error::the configuration failure is not a single line"; exit 1; }
          if grep -q 'Platform ready' "$log"; then
            echo "::error::a missing catalog reached readiness"
            exit 1
          fi
          if grep -E 'Exception in thread|Caused by:|[[:space:]]at com\.l2jfree\.' "$log"; then
            echo "::error::the configuration failure has a stack trace"
            exit 1
          fi

      - name: Upload the empty-world logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: empty-world-logs
          if-no-files-found: warn
          path: |
            empty-positive-server.log
            empty-missing-catalog-server.log

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/empty-world.compose.yaml down -v || true

  # Starts the same image on the authored world, mounted from this repository. The image and the image job stay as they
  # are: this job only points the server at world/ and runs the seed-loop scenario of the smoke client.
  seed-world:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      L2JFREE_IMAGE: l2jfree:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: l2jfree-dist
          path: dist

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Stage the image context
        run: |
          unzip -q dist/l2jfree-platform-*-dist.zip -d deploy/image
          test -f deploy/image/l2jfree/config/server.properties
          test -d deploy/image/l2jfree/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          load: true
          tags: l2jfree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image content
        run: deploy/verify-image.sh l2jfree:ci

      - name: Point the server at the authored world
        run: |
          set -euo pipefail
          docker volume create l2jfree_config
          docker run --rm --entrypoint bash -v l2jfree_config:/var/lib/l2jfree/config l2jfree:ci -c '
            printf "%s\n" \
              "DatapackRoot = /world" \
              "CatalogDirectory = /world/catalog" \
              "AcceptWarn = 1000" \
              "AcceptReject = 2000" \
              "AcceptWarnLong = 3000" \
              "AcceptRejectLong = 6000" \
              > /var/lib/l2jfree/config/server.properties
            printf "%s\n" \
              "AcceptWarn = 1000" \
              "AcceptReject = 2000" \
              "AcceptWarnLong = 3000" \
              "AcceptRejectLong = 6000" \
              > /var/lib/l2jfree/config/loginserver.properties
            printf "%s\n" "AltDefaultRestartTown = 731" > /var/lib/l2jfree/config/altsettings.properties'
          cat > deploy/seed-world.compose.yaml <<EOF
          services:
            server:
              restart: "no"
              volumes:
                - ${GITHUB_WORKSPACE}/world:/world:ro
          EOF

      - name: Start on the authored world
        run: docker compose -f deploy/compose.yaml -f deploy/seed-world.compose.yaml up -d --wait --wait-timeout 600

      - name: Probe the login and world ports
        run: |
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 7777 --timeout 60 --connect-only

      - name: Take one client through the authored loop
        run: java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 900 --scenario seed-loop

      - name: Take many clients through the authored loop at once
        run: java -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 900 --sessions 24 --parallel 24 --scenario seed-loop

      - name: Save the server log
        if: always()
        run: |
          if [ -f deploy/compose.yaml ] && [ -f deploy/seed-world.compose.yaml ]; then
            docker compose -f deploy/compose.yaml -f deploy/seed-world.compose.yaml logs --no-color server > seed-world-server.log || true
          fi
          touch seed-world-server.log

      - name: Check the server log
        run: |
          set -euo pipefail
          log=seed-world-server.log
          test -s "$log" || { echo "::error::the server log is empty"; exit 1; }
          test "$(grep -c 'World id=buyan-okolitsa version=3.2.0 ' "$log" || true)" = 1 \
            || { echo "::error::the passport line is not unique"; exit 1; }
          grep 'World id=buyan-okolitsa version=3.2.0 ' "$log"
          grep -q 'Platform ready' "$log" || { echo "::error::the server did not become ready"; exit 1; }
          grep -q 'World has no scripts' "$log" || { echo "::error::the log does not say the world has no scripts"; exit 1; }
          test "$(grep -c 'World has no scripts' "$log" || true)" = 1 \
            || { echo "::error::the no-scripts line is not unique"; exit 1; }
          if grep -E '(^|\| )ERROR |Exception in thread|Caused by:|[[:space:]]at com\.l2jfree\.' "$log"; then
            echo "::error::the server log has an ERROR line, an uncaught exception, or a stack trace"
            exit 1
          fi
          if grep -E '(^|\| )WARN ' "$log"; then
            echo "::error::the server log has a WARN line"
            exit 1
          fi
          if grep -E 'Failed executing script|Failed loading:' "$log"; then
            echo "::error::the server log reports a failed script"
            exit 1
          fi

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seed-world-server-log
          if-no-files-found: warn
          path: seed-world-server.log

      - name: Stop the stack
        if: always()
        run: |
          if [ -f deploy/compose.yaml ] && [ -f deploy/seed-world.compose.yaml ]; then
            docker compose -f deploy/compose.yaml -f deploy/seed-world.compose.yaml down -v || true
          fi

  # Measures the start of the server under G1 and ZGC, with and without the AOT cache. It runs on request (workflow_dispatch),
  # reports, and never fails the pipeline: a shared runner is too noisy to gate on, a run takes about twenty minutes,
  # and the numbers are read by a person.
  startup:
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: l2jfree-dist
          path: dist

      - name: Stage the image context
        run: unzip -q dist/l2jfree-platform-*-dist.zip -d deploy/image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          load: true
          tags: l2jfree:ci
          cache-from: type=gha

      - name: Measure the start
        run: |
          mkdir -p startup
          python3 deploy/measure/startup.py --image l2jfree:ci --runs 3 --output startup | tee startup/table.txt
          {
            echo "### Start of the server, from the start of the JVM to the open ports"
            echo
            cat startup/startup.md
            echo
            echo "Cold is the first start on an empty database, without a cache. New container is the next start in a new container on the loaded database. Restart is a restart of that container. Resident memory is read ten seconds after the ports open. Runner: $(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2}') MiB."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-measurement
          path: startup
          if-no-files-found: ignore

  # A restart of the container is slower than a start in a new container. The same stop is followed by three kinds of
  # start to find out what the difference depends on.
  restart-diagnosis:
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: l2jfree-dist
          path: dist

      - name: Stage the image context
        run: unzip -q dist/l2jfree-platform-*-dist.zip -d deploy/image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          load: true
          tags: l2jfree:ci
          cache-from: type=gha

      - name: Compare the kinds of start after a stop
        run: |
          mkdir -p startup
          python3 deploy/measure/startup.py --image l2jfree:ci --runs 3 --diagnose --output startup | tee startup/restart-table.txt
          {
            echo "### The same stop, followed by three kinds of start (G1)"
            echo
            cat startup/restart.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restart-diagnosis
          path: startup
          if-no-files-found: ignore

  # The line coverage of all the tests, unit and database, reported on request. It gates nothing: the numbers show
  # which packages no test reaches, so that tests are added where the code is least covered.
  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      - name: Run every test with coverage
        run: ./mvnw -B -ntp -Pcoverage -Dsurefire.excludedGroups= -Dl2jfree.build.revision=${{ github.sha }} verify

      - name: Summarize the coverage
        if: always()
        run: |
          python3 tools/ci/coverage-summary.py --root . | tee coverage.md
          {
            echo "### Line coverage of the tests"
            echo
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          if-no-files-found: ignore
          path: |
            coverage.md
            */target/site/jacoco
