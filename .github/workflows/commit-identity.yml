name: commit identity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-identity:
    name: commit-identity
    runs-on: ubuntu-latest
    steps:
      - name: Verify commit authors and messages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const allowedEmail = "131531301+l2go@users.noreply.github.com";
            const invalid = commits.filter(({ author, commit }) =>
              author?.login !== "l2go" ||
              commit.author?.email !== allowedEmail ||
              /^co-authored-by:/im.test(commit.message)
            );

            if (invalid.length > 0) {
              core.setFailed(
                `${invalid.length} commit(s) failed the repository author policy. ` +
                "Every commit must resolve to l2go and must not include a co-author trailer."
              );
            }
