name: pages

# Builds the project site from this repository: pages and notes from site/, the
# alatyr/1 reference from the participant dictionary, releases from the
# changelog, and the live world as WebAssembly. Pull requests build it; main
# deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["site/**", "engine/go/**", "world/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "engine/go/**", "world/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Build the site and the live world
        working-directory: engine/go/server
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          out="$RUNNER_TEMP/site"
          go run ./cmd/alatyr-site -root ../../.. -out "$out"
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o "$out/live/alatyr-live.wasm" ./cmd/alatyr-live
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "$out/live/"
          test -s "$out/index.html" && test -s "$out/live/world.zip"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
