# ================================================================
# General login server setting !!! REQUIRED to configure to everyone !!!
# ================================================================

# Bind ip of the loginserver, use 0.0.0.0 to bind on all available IPs
LoginServerHostname = 0.0.0.0
LoginServerPort = 2106

# Connections one address may open. The server logs a warning above the first number and refuses connections above
# the second, counted over the seconds named, in a short and in a long period. All players behind one address (the
# gateway of Docker Desktop or Colima, a network address translator) count as one address, so raise the numbers for a
# server that many of them reach through such an address.
AcceptWarn = 10
AcceptReject = 20
AcceptSeconds = 10
AcceptWarnLong = 30
AcceptRejectLong = 60
AcceptSecondsLong = 60

GMMinLevel = 100

# If false, the license (after the login) will not be shown
ShowLicence = True

# Database info
# PostgreSQL 18. The login module owns the schema "login" and migrates it at start.
Driver = org.postgresql.Driver
URL = jdbc:postgresql://localhost/l2jfree
Login = l2jfree_login
Password =
# Pooled connections. Idle connections are capped at the maximum.
MaximumDbConnections = 20
MinimumDbIdleConnections = 1

# Useable values: "True" - "False", use this option to choose whether accounts will be created
# automatically or not.
AutoCreateAccounts = True

# ==============================================================
# Test server setting, shoudnt be touched in online game server
# ==============================================================

Debug = False
Assert = False

#Ban management
# number of attempt before a user is banned when he fails his login
LoginTryBeforeBan = 10
# Time you won't be able to login back again after LoginTryBeforeBan tries to login. Provide a value in seconds. Default 10min. (600)
LoginBlockAfterBan = 600

# An option that provides basic [OOG] client emulator protection (no client modding needed)
# After logging in, a user must input any text inside a dialog to continue.
UseSecurityCardToLogin = False
# Input verification is not done.
SecurityCardID = l2jfree
