# Mount operator-owned JSON under ./config; see README.md before first start.
name: alatyr

x-server: &server
  image: ${ALATYR_IMAGE:-ghcr.io/l2go/alatyr:edge}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  secrets:
    <<: *server
    entrypoint: ["/opt/alatyr/bin/init-secrets"]
    volumes:
      - secrets:/var/lib/alatyr/secrets
      - dbsecrets:/var/lib/alatyr/secrets-db
    restart: "no"

  db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: alatyr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/alatyr-dbsecrets/postgres_password
    volumes:
      - dbdata:/var/lib/postgresql
      - dbsecrets:/run/alatyr-dbsecrets:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d alatyr"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  server:
    <<: *server
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALATYR_DATABASE_URL_FILE: /var/lib/alatyr/secrets/database_url
      ALATYR_CONFIG: /run/alatyr/config/server.json
      GOMAXPROCS: "2"
      GOMEMLIMIT: 192MiB
    mem_limit: 256m
    # Ports close, writes join, and remaining players save before the process exits.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${ALATYR_BIND:-127.0.0.1}:${ALATYR_HTTP_PORT:-8080}:8080"
    volumes:
      - secrets:/var/lib/alatyr/secrets:ro
      - ${ALATYR_CONFIG_DIR:-./config}:/run/alatyr/config:ro
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,noexec
    restart: unless-stopped

volumes:
  secrets:
  dbsecrets:
  dbdata:
