<text class="t" x="490" y="127" text-anchor="middle">Gateway</text>
<text class="t t--small" x="490" y="149" text-anchor="middle">BOUNDED SESSIONS</text>

<rect class="node" x="625" y="96" width="210" height="72" rx="6"/>
<text class="t" x="730" y="127" text-anchor="middle">World port</text>
<text class="t t--small" x="730" y="149" text-anchor="middle">FACTS · RECEIPTS</text>

<path class="tick" d="M610 133 V186"/>
<rect class="tag" x="522" y="186" width="176" height="28" rx="3"/>
<text class="t t--small" x="610" y="204" text-anchor="middle">RAW-PORT CONTRACT</text>

<rect class="node" x="385" y="296" width="210" height="72" rx="6"/>
<text class="t" x="490" y="327" text-anchor="middle">Go world</text>
<text class="t t--small" x="490" y="349" text-anchor="middle">ONE SIMULATION LOOP</text>
<circle class="pulse" cx="403" cy="314" r="3"/>

<rect class="node" x="625" y="296" width="210" height="72" rx="6"/>
<text class="t" x="730" y="327" text-anchor="middle">Persistence</text>
<text class="t t--small" x="730" y="349" text-anchor="middle">PGX · CHECKPOINTS</text>

<rect class="node node--data" x="170" y="296" width="166" height="72" rx="6"/>
<text class="t" x="253" y="327" text-anchor="middle">Authored world</text>
<text class="t t--small t--steel" x="253" y="349" text-anchor="middle">OKOLITSA · FILES</text>

<path class="db" d="M950 152 a 95 12 0 0 1 190 0 v 30 a 95 12 0 0 1 -190 0 z"/>
<path class="db" d="M950 152 a 95 12 0 0 0 190 0" fill="none"/>
<text class="t t--db" x="1045" y="180" text-anchor="middle">world</text>
<text class="t t--mono" x="1045" y="226" text-anchor="middle">player · item · player_skill</text>
<text class="t t--mono" x="1045" y="248" text-anchor="middle">goose_db_version</text>
<path class="rule" d="M968 280 H1122"/>
<text class="t t--small t--steel" x="1045" y="314" text-anchor="middle">FORWARD-ONLY MIGRATIONS</text>
<text class="t t--small t--steel" x="1045" y="336" text-anchor="middle">ONE WRITER · ADVISORY LEASE</text>
</svg>
