<path class="flow" d="M194 130 H490 V132 H730 V168 C 730 236, 490 228, 490 296 V332 H835"/>
<path class="flow flow--db f2" d="M336 332 H385"/>
<path class="flow flow--db f3" d="M835 332 C 900 332, 892 166, 950 166"/>

<rect class="node node--ext" x="24" y="96" width="170" height="68" rx="34"/>
