{{define "title"}}{{.Note.Title}} — Alatyr{{end}}
{{define "description"}}{{.Note.Summary}}{{end}}
{{define "main"}}
<article>
<header class="article-head article-head--whole">
  <picture><img src="/alatyr/assets/img/covers/{{.Note.Cover}}.webp" alt="" width="1600" height="667"></picture>
  <div class="wrap">
    <div class="crumbs"><a href="/alatyr/notes/">Notes</a> · Building an honest world</div>
    <h1>{{.Note.Title}}</h1>
    <p class="dek">{{.Note.Summary}}</p>
    <div class="byline"><time datetime="{{.Note.Date}}">{{.Note.Date}}</time></div>
  </div>
</header>
<div class="prose">
{{template "body" .}}
</div>
</article>
{{end}}
